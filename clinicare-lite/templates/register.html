{% extends "base.html" %}
{% block title %}Register — ClinicCare-Lite{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 shadow-sm">
      <h1 class="h4 mb-3">Create an account</h1>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">I am a</label>
          <select class="form-select" name="role" id="role" onchange="document.getElementById('clinic-field').classList.toggle('d-none', this.value !== 'patient')">
            <option value="clinician" {% if form and form.role=='clinician' %}selected{% endif %}>Clinician</option>
            <option value="patient" {% if not form or form.role=='patient' %}selected{% endif %}>Patient</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">ID (8 digits — clinicians end in 0000, patients end in the registration year)</label>
          <input class="form-control" name="user_id" maxlength="8" value="{{ form.user_id if form else '' }}" required>
        </div>
        <div class="mb-3" id="clinic-field">
          <label class="form-label">Clinician ID of the clinic you're joining (patients only)</label>
          <input class="form-control" name="clinic_id" maxlength="8" value="{{ form.clinic_id if form else '' }}">
        </div>
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input class="form-control" name="name" value="{{ form.name if form else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" name="email" value="{{ form.email if form else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password (8+ chars, upper, lower, digit, special)</label>
          <input class="form-control" type="password" name="password" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm password</label>
          <input class="form-control" type="password" name="confirm_password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Register</button>
      </form>
      <p class="mt-3 mb-0 small">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
