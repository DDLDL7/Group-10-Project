{% extends "base.html" %}
{% block title %}Register - ClinicCare-Lite{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <h2 class="mb-3">Register</h2>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select" id="roleSelect" onchange="document.getElementById('clinicField').style.display = this.value === 'patient' ? 'block' : 'none'">
          <option value="clinician" {{ 'selected' if form_role == 'clinician' }}>Clinician</option>
          <option value="patient" {{ 'selected' if form_role == 'patient' }}>Patient</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">ID (8 digits — clinician ends in 0000, patient ends in registration year 2022–2028)</label>
        <input type="text" name="user_id" class="form-control" required pattern="\d{8}" value="{{ form_user_id or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input type="text" name="name" class="form-control" required value="{{ form_name or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required value="{{ form_email or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label">Password (8+ chars, upper, lower, digit, one of !@#$%^&*)</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="mb-3" id="clinicField" style="display: {{ 'block' if form_role == 'patient' else 'none' }};">
        <label class="form-label">Clinic</label>
        <select name="clinic_id" class="form-select">
          <option value="">-- select a clinic --</option>
          {% for clinic in clinics %}
          <option value="{{ clinic.clinic_id }}" {{ 'selected' if form_clinic_id == clinic.clinic_id }}>{{ clinic.name }}</option>
          {% endfor %}
        </select>
        <div class="form-text">Clinicians registering for the first time automatically create a new clinic.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="mt-3 text-center"><a href="{{ url_for('login') }}">Already have an account? Log in</a></p>
  </div>
</div>
{% endblock %}
