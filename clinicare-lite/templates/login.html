{% extends "base.html" %}
{% block title %}Log in — ClinicCare-Lite{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="card p-4 p-md-5 shadow-sm">
      <h1 class="h4 mb-4">Log in</h1>
      <form method="post">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">ID (8 digits)</label>
            <input class="form-control" name="user_id" maxlength="8" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
          </div>
        </div>
        <button class="btn btn-primary px-5" type="submit">Log in</button>
      </form>
      <p class="mt-3 mb-0 small">No account? <a href="{{ url_for('register') }}">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}
