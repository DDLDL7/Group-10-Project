{% extends "base.html" %}
{% block title %}New Announcement{% endblock %}
{% block content %}
<h2>Post Clinic Announcement</h2>
<p class="text-muted">Visible to every patient registered at your clinic.</p>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Message</label>
    <textarea name="content" class="form-control" rows="4" required></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Post to all patients</button>
</form>
{% endblock %}
